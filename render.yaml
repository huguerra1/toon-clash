# Servidor de salas do modo online no Render (plano grátis). Passo a passo em docs/ONLINE.md.
services:
  - type: web
    name: toon-clash-server
    runtime: node
    plan: free
    # Região mais perto do Brasil entre as do Render.
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: npm run server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Sites que podem abrir salas (vazio = qualquer um). Preencha no painel do Render, ex.:
      # https://huguerra1.github.io,https://*.itch.zone
      - key: ALLOWED_ORIGINS
        sync: false
    # Só publica de novo quando o servidor muda, não a cada mudança no jogo.
    buildFilter:
      paths:
        - server/**
        - package.json
        - package-lock.json
