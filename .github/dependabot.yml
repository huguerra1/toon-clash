version: 2
updates:
  # Dependências do jogo e do servidor de salas.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Atualizações pequenas chegam num PR só, para não lotar a fila.
      menores:
        update-types: [minor, patch]

  # Versões das actions usadas no CI.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
